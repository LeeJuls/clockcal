<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>clockcal</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel" id="panel">
      <header class="top">
        <div class="clock-block">
          <div class="clock" id="clock"></div>
          <div class="date" id="date"></div>
        </div>
        <div class="top-btns">
        <button class="icon-btn" id="settings-btn" type="button" aria-label="설정" title="설정">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 4h7M12 4h2M2 8h2M7 8h7M2 12h9M14 12h0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10.5" cy="4" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="5.5" cy="8" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="12.5" cy="12" r="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="icon-btn" id="refresh" type="button" aria-label="새로고침" title="새로고침">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5V5h-2.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        </div>
      </header>

      <div class="banner" id="banner" role="status" hidden></div>

      <section class="cal">
        <div class="cal-head">
          <div class="month-title" id="month-title"></div>
          <div class="cal-nav">
            <button class="icon-btn" id="prev" type="button" aria-label="이전 달" title="이전 달 (PageUp)">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="text-btn" id="today-btn" type="button" title="오늘 (Home)">오늘</button>
            <button class="icon-btn" id="next" type="button" aria-label="다음 달" title="다음 달 (PageDown)">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div class="dow" id="dow"></div>
        <div class="grid" id="grid" role="grid"></div>
      </section>

      <section class="agenda-wrap">
        <div class="agenda-title" id="agenda-title"></div>
        <div class="agenda" id="agenda"></div>
      </section>
      <section class="settings" id="settings" role="dialog" aria-labelledby="settings-title" hidden>
        <div class="settings-head">
          <button class="icon-btn" id="settings-back" type="button" aria-label="뒤로" title="뒤로 (Esc)">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="settings-title" id="settings-title"></div>
        </div>
        <label class="row"><span id="lbl-notify"></span><input type="checkbox" id="set-notify" /></label>
        <label class="row"><span id="lbl-lead"></span>
          <select id="set-lead"><option value="1">1</option><option value="3">3</option><option value="5">5</option><option value="10">10</option><option value="15">15</option><option value="30">30</option><option value="60">60</option></select>
        </label>
        <label class="row"><span id="lbl-autostart"></span><input type="checkbox" id="set-autostart" /></label>
        <label class="row"><span id="lbl-clockhook"></span><input type="checkbox" id="set-clockhook" /></label>
        <div class="row"><span id="lbl-reimport"></span><button class="mini-btn" id="set-reimport" type="button"></button></div>
        <div class="row"><span id="lbl-logout"></span><button class="mini-btn" id="set-logout" type="button"></button></div>
        <input type="file" id="client-file" accept=".json,application/json" hidden />
        <div class="settings-note" id="settings-note" role="status"></div>
      </section>
    </div>
    <script src="strings.js"></script>
    <script src="logic.js"></script>
    <script src="main.js"></script>
  </body>
</html>
